name: ci-webapp

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-webapp-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.3
  PNPM_VERSION: 11.28.12
  NEXT_PUBLIC_CHAIN_ID: '42220'
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_PUBLIC_CELO_RPC_URL: https://forno.celo.org
  NEXT_PUBLIC_VERIWORK_CORE_ADDRESS: '0x0000000000000000000000000000000000000001'
  NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS: '0x0000000000000000000000000000000000000002'

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm turbo run typecheck --filter=!@veriwork/contracts
      - run: pnpm turbo run lint --filter=!@veriwork/contracts
      - run: pnpm turbo run test --filter=!@veriwork/contracts
        env:
          CI: 'true'
      - run: pnpm turbo run build --filter=@veriwork/web-app --filter=@veriwork/agent-worker

  e2e:
    needs: typescript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @veriwork/web-app exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@veriwork/web-app
        env:
          E2E_MODE: '1'
      - run: pnpm --filter @veriwork/web-app test:e2e
        env:
          CI: 'true'
          E2E_MODE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: packages/web-app/playwright-report
          retention-days: 7
