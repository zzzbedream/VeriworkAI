name: worker-cron

# Runs the VeriWork agent-worker once every 15 minutes (WORKER_MODE=once) on GitHub-hosted runners:
# indexer, sentinel and epoch watchtower, faucet relayer, pipeline automation, Wallet Week bits,
# weekly settlement and slashing when due, and Telegram notifications. Each job decides from the
# database and the chain whether it is due, so a run that has nothing to do exits quickly.
# Enable it by setting the repository variable WORKER_CRON_ENABLED=true and the secrets below.
# Secrets are exposed ONLY to the final step (never to checkout/setup actions or to install scripts),
# only runs from the default branch get them, and every third-party action is pinned to a full SHA.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no transactions, no messages, no database writes)'
        type: boolean
        default: true

permissions:
  contents: read

# Shared with worker-seed-demo: one run at a time uses the operator key (nonces) and the database.
concurrency:
  group: worker-cron
  cancel-in-progress: false

jobs:
  run-once:
    if: ${{ vars.WORKER_CRON_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm turbo run build --filter=@veriwork/agent-worker
      - name: Run due jobs once
        env:
          NODE_ENV: production
          WORKER_MODE: once
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          CHAIN_ID: ${{ vars.CHAIN_ID || '42220' }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL || 'https://forno.celo.org' }}
          CELO_RPC_FALLBACK_URLS: https://forno.celo.org
          VERIWORK_CORE_ADDRESS: ${{ vars.VERIWORK_CORE_ADDRESS }}
          AGENT_REGISTRY_ADDRESS: ${{ vars.AGENT_REGISTRY_ADDRESS }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          WORKER_ENABLE_PIPELINE: ${{ vars.WORKER_ENABLE_PIPELINE || 'true' }}
          WORKER_ENABLE_SETTLEMENT: ${{ vars.WORKER_ENABLE_SETTLEMENT || 'true' }}
          WORKER_ENABLE_WALLET_WEEK: ${{ vars.WORKER_ENABLE_WALLET_WEEK || 'true' }}
          WORKER_ENABLE_INDEXER: ${{ vars.WORKER_ENABLE_INDEXER || 'true' }}
          WORKER_ENABLE_SENTINEL: ${{ vars.WORKER_ENABLE_SENTINEL || 'true' }}
          WORKER_ENABLE_TELEGRAM: ${{ vars.WORKER_ENABLE_TELEGRAM || 'true' }}
          WORKER_ENABLE_FAUCET_RELAYER: ${{ vars.WORKER_ENABLE_FAUCET_RELAYER || 'true' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'fixture' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-5-5' }}
          AI_EFFORT: ${{ vars.AI_EFFORT || 'medium' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          GUARDIAN_PRIVATE_KEY: ${{ secrets.GUARDIAN_PRIVATE_KEY }}
          AI_AGENT_PRIVATE_KEY: ${{ secrets.AI_AGENT_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node packages/agent-worker/dist/index.js --once --dry-run
          else
            node packages/agent-worker/dist/index.js --once
          fi
