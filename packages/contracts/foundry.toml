# VeriWork contracts — Celo mainnet (chainId 42220).
# Celo supports Shanghai/Cancun/Prague opcodes but NOT Osaka (CLZ). forge 1.7+ and solc >=0.8.31
# default to osaka, so evm_version must stay pinned to "prague".
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
auto_detect_solc = false
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]
# Vendored OpenZeppelin / forge-std code is audited upstream; keep its compiler notes out of our output.
ignored_warnings_from = ["lib"]

[lint]
# Wallet Weeks and UBI days are timestamp-based by design (1 s Celo blocks, day-scale windows).
exclude_lints = ["block-timestamp"]
# Tests deliberately use narrowing casts and literal fixtures.
ignore = ["test/**/*.sol"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 256

[rpc_endpoints]
celo = "https://forno.celo.org"
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
