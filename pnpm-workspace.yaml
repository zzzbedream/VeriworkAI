packages:
  - packages/*

# Single source of truth for shared versions (reference them as "catalog:" in package.json).
catalog:
  typescript: 6.0.3
  '@types/node': 24.19.2
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  viem: 2.57.19
  zod: 4.6.7
  dotenv: 18.0.10
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
  vite: 8.3.8
  prisma: 7.10.1
  '@prisma/client': 7.10.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/dev': 0.24.17
  pg: 8.23.1
  '@types/pg': 8.23.1
  '@openzeppelin/merkle-tree': 1.0.8
  pino: 10.4.0
  tsx: 4.23.15

# pnpm 11: strictDepBuilds fails installs on unreviewed install scripts; every build script is reviewed here.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@reown/appkit': false
  fsevents: false
  sharp: false
  unrs-resolver: false

# GoodDollar SDKs declare react / citizen-sdk as dependencies with loose ranges: force singletons.
overrides:
  react: 19.3.1
  react-dom: 19.3.1
  '@goodsdks/citizen-sdk': 1.2.8

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '10'
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'

# Supply-chain guard: refuse packages published less than 24h ago.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - ox
  - '@next/eslint-plugin-next'
